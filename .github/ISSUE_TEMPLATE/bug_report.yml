name: Bug report
description: Report a reproducible problem with GitHub Deco
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include tokens, API keys, private data, or other secrets.
        Report suspected vulnerabilities privately using the security contact link instead.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the problem and its impact.
      placeholder: What went wrong, and who or what is affected?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Request or configure ...
        2. Open or run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: endpoint
    attributes:
      label: Endpoint or sample URL
      description: Include a minimal endpoint or URL if relevant. Remove credentials, tokens, private usernames, and sensitive query values.
      placeholder: https://example.test/api/card?sections=profile&username=octocat

  - type: textarea
    id: environment
    attributes:
      label: Environment and deployment
      description: Include the commit or version, Node.js version, operating system, browser or client, and hosting environment as applicable.
      placeholder: Commit/version, Node.js, OS, browser/client, self-hosted platform
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Add relevant logs, responses, or screenshots after removing secrets and private data.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks and acknowledgements
      options:
        - label: I searched existing issues for a duplicate.
          required: true
        - label: I can reproduce this problem with the information provided above.
          required: true
        - label: I removed secrets and private data from all URLs, logs, responses, and screenshots.
          required: true
        - label: This is not an undisclosed security vulnerability; those must be reported privately.
          required: true
